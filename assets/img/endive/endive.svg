<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 132" role="img" aria-label="A Belgian endive">
  <title>Belgian endive</title>
  <defs>
    <!-- A witloof head is ivory almost everywhere; only the tips of the leaves
         keep a pale yellow-green, so the green stops stay in the top tenth of
         each leaf's own bounding box. -->
    <linearGradient id="en-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2d873"/>
      <stop offset=".11" stop-color="#d8e29d"/>
      <stop offset=".24" stop-color="#ece7cd"/>
      <stop offset=".6" stop-color="#ece3c5"/>
      <stop offset="1" stop-color="#ded2aa"/>
    </linearGradient>
    <linearGradient id="en-back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4cb60"/>
      <stop offset=".13" stop-color="#d0d98e"/>
      <stop offset=".28" stop-color="#e5deb9"/>
      <stop offset="1" stop-color="#ddd1a7"/>
    </linearGradient>
    <linearGradient id="en-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cbe07a"/>
      <stop offset=".1" stop-color="#e6eeae"/>
      <stop offset=".25" stop-color="#faf7e6"/>
      <stop offset=".72" stop-color="#f7f1de"/>
      <stop offset="1" stop-color="#eae0c1"/>
    </linearGradient>
    <linearGradient id="en-shoulder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8dd76"/>
      <stop offset=".12" stop-color="#e8eebb"/>
      <stop offset=".4" stop-color="#f4eed8"/>
      <stop offset="1" stop-color="#f4eed8"/>
    </linearGradient>
  </defs>

  <!-- The head. Nearly parallel sides over most of the height and a blunt,
       domed top: that is what separates a chicon from a leaf. -->
  <path d="M40 10c6 1 12 8 15 22 3 14 4 28 4 48s-1 32-2 38c-7 2-27 2-34 0-1-6-2-18-2-38s1-34 4-48c3-14 9-21 15-22Z"
        fill="url(#en-body)" stroke="#adbe64" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- outer leaf seen on the left, wrapping behind the front one -->
  <path d="M34 14c-5 12-10 30-12 50-2 20-2 40 1 54 3 1 5 1 6 0-2-12-3-32-1-54 2-22 5-42 6-50Z"
        fill="url(#en-back)" stroke="#bcc87a" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- the leaf wrapped over the front, its edge sweeping up to the tip -->
  <path d="M38 11c7 1 13 8 16 22 3 14 4 28 4 48s-1 31-2 37c-8 2-20 2-27 0-2-12-3-32-1-54 2-22 5-42 10-53Z"
        fill="url(#en-front)" stroke="#c0cd80" stroke-width="1.1" stroke-linejoin="round"/>

  <!-- a shorter leaf tip showing on the right shoulder -->
  <path d="M47 17c5 9 8 21 9 35 1 10 1 18 0 26-2-12-4-30-8-44-1-6-2-13-1-17Z"
        fill="url(#en-shoulder)" stroke="#c6d287" stroke-width="1" stroke-linejoin="round" opacity=".95"/>

  <!-- two leaf tips splaying at the crown -->
  <path d="M34 14c-2 4-3 8-3 12 2-3 4-6 5-9 1-2 0-3-2-3Z" fill="#b8cf67" opacity=".75"/>
  <path d="M45 13c2 4 4 8 5 13-2-3-5-7-6-10-1-2 0-3 1-3Z" fill="#c1d670" opacity=".7"/>

  <!-- veins -->
  <path d="M42 112c-2-20-2-50 1-80" fill="none" stroke="#e1d8b1" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M50 110c1-18 2-46 0-66" fill="none" stroke="#e0d6ad" stroke-width="1" stroke-linecap="round" opacity=".7"/>
  <path d="M35 110c-1-18-1-44 1-62" fill="none" stroke="#ded4a8" stroke-width="1" stroke-linecap="round" opacity=".5"/>

  <!-- the base, cut flush -->
  <path d="M23 112c10 3 24 3 34 0 1 3 1 7 0 10-10 3-24 3-34 0-1-3-1-7 0-10Z"
        fill="#dbc796" stroke="#bfa96f" stroke-width="1.2" stroke-linejoin="round"/>
</svg>
