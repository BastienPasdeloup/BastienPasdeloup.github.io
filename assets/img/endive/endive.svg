<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 6 88 108" role="img" aria-label="A Belgian endive">
  <title>Belgian endive</title>
  <defs>
    <!-- Drawn along a vertical axis and then laid down, the way a chicon is
         photographed: a fat spindle, pointed at the leaf end, blunt at the
         root end, near-white with a strong yellow-green over the tip third.
         Every gradient runs along that axis before the rotation. -->
    <linearGradient id="en-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8cc63c"/>
      <stop offset=".07" stop-color="#a6d254"/>
      <stop offset=".17" stop-color="#c9e186"/>
      <stop offset=".29" stop-color="#e9f2c8"/>
      <stop offset=".42" stop-color="#f9fcf0"/>
      <stop offset=".78" stop-color="#f5f9e8"/>
      <stop offset="1" stop-color="#e5edd3"/>
    </linearGradient>
    <linearGradient id="en-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74b025"/>
      <stop offset=".1" stop-color="#8fc43c"/>
      <stop offset=".24" stop-color="#b5d868"/>
      <stop offset=".42" stop-color="#dcecab"/>
      <stop offset=".66" stop-color="#f2f7e2"/>
      <stop offset="1" stop-color="#eef4dc"/>
    </linearGradient>
    <linearGradient id="en-second" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#82bc31"/>
      <stop offset=".18" stop-color="#a8d24f"/>
      <stop offset=".45" stop-color="#d9eaa4"/>
      <stop offset="1" stop-color="#f1f6e0"/>
    </linearGradient>
    <linearGradient id="en-shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity="0"/>
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#5f6b3a" stop-opacity=".16"/>
    </linearGradient>
  </defs>

  <g transform="rotate(-30 60 60)">
    <!-- the whole head -->
    <path d="M57 15c-7 11-15 31-16 51-1 16 5 32 13 39 3 2 9 2 12 0 8-7 14-23 13-39-1-20-9-40-16-51-2-2-4-2-6 0Z"
          fill="url(#en-body)"/>

    <!-- the outer leaf wrapped over the front, its edge sweeping from the
         tip down to the middle of the body -->
    <path d="M57 15c-7 11-15 31-16 51-1 16 5 32 13 39-3-12-4-27-2-42 2-16 6-33 11-46-2-2-4-2-6-2Z"
          fill="url(#en-outer)"/>

    <!-- a second leaf tip, shorter, showing behind the first -->
    <path d="M63 17c4 10 7 24 8 38 1 12 0 23-2 31 1-11 0-24-2-37-2-12-4-23-6-31Z"
          fill="url(#en-second)" opacity=".9"/>

    <!-- long soft veins fanning from the root end towards the tip -->
    <g fill="none" stroke="#fff" stroke-linecap="round" opacity=".5">
      <path d="M54 100c-3-13-4-30-2-46 2-15 5-27 8-36" stroke-width="1.3"/>
      <path d="M62 101c2-13 3-30 1-45-1-14-3-25-5-33" stroke-width="1.1"/>
      <path d="M68 96c2-11 2-26 0-39-1-11-3-20-5-27" stroke-width="1"/>
    </g>
    <path d="M47 88c-2-11-2-24 0-36" fill="none" stroke="#b9d472" stroke-width="1" stroke-linecap="round" opacity=".55"/>

    <!-- the root end: cut flush, so a faint crease across the blunt tip -->
    <path d="M54 104c4 2 8 2 12 0" fill="none" stroke="#cfd9ae" stroke-width="1.4" stroke-linecap="round" opacity=".8"/>

    <!-- volume down the shaded flank -->
    <path d="M57 15c-7 11-15 31-16 51-1 16 5 32 13 39 3 2 9 2 12 0 8-7 14-23 13-39-1-20-9-40-16-51-2-2-4-2-6 0Z"
          fill="url(#en-shade)"/>
    <path d="M57 15c-7 11-15 31-16 51-1 16 5 32 13 39 3 2 9 2 12 0 8-7 14-23 13-39-1-20-9-40-16-51-2-2-4-2-6 0Z"
          fill="none" stroke="#a8c95e" stroke-width="1.1" stroke-linejoin="round" opacity=".75"/>
  </g>
</svg>
