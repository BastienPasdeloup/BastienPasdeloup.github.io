<body>

    <h1 id="heading">Redirection</h1>
    <p id="message" class="muted">Reading the requested reference&hellip;</p>
    <div id="listing" hidden>
        <input id="filter" type="search" placeholder="Filter the references&hellip;" autocomplete="off">
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Reference</th>
                    <th>Address</th>
                </tr>
            </thead>
            <tbody id="rows"></tbody>
        </table>
    </div>

    <noscript>
        <p>This page needs JavaScript to redirect. The addresses it knows are in the
            source of the page.</p>
    </noscript>

    <script>
        (function () {
            var links = window.SHORT_LINKS || {};
            var heading = document.getElementById("heading");
            var message = document.getElementById("message");
            var listing = document.getElementById("listing");
            var rows = document.getElementById("rows");
            var filter = document.getElementById("filter");

            // The key is given either as a query ("/r/?key") or as a fragment ("/r/#key"),
            // both of which scanners and browsers keep as typed
            var key = decodeURIComponent((location.search || location.hash).slice(1)).trim();

            function link(url, text) {
                var a = document.createElement("a");
                a.href = url;
                a.textContent = text || url;
                a.rel = "noreferrer";
                return a;
            }

            function showListing(keys) {
                rows.textContent = "";
                keys.sort().forEach(function (code) {
                    var row = document.createElement("tr");
                    var left = document.createElement("td");
                    var middle = document.createElement("td");
                    var right = document.createElement("td");
                    left.appendChild(link("/r/?" + encodeURIComponent(code), code));
                    middle.textContent = links[code][0];
                    right.appendChild(link(links[code][1]));
                    row.appendChild(left);
                    row.appendChild(middle);
                    row.appendChild(right);
                    rows.appendChild(row);
                });
                listing.hidden = false;
            }

            var names = Object.keys(links);

            if (key && Object.prototype.hasOwnProperty.call(links, key)) {
                // Known reference: leave without adding an entry to the history
                var target = links[key][1];
                heading.textContent = "Redirecting";
                message.textContent = "";
                message.appendChild(document.createTextNode("Going to "));
                message.appendChild(link(target));
                location.replace(target);
                return;
            }

            if (key) {
                heading.textContent = "Unknown code";
                message.textContent = "No resource is associated with “" + key + "”. "
                    + "The known codes are listed below.";
            } else if (names.length) {
                message.textContent = "Add the code of a resource to the address, "
                    + "as in /r/?mar, or pick one below.";
            } else {
                message.textContent = "No association is defined yet.";
                return;
            }

            showListing(names);

            filter.addEventListener("input", function () {
                var needle = filter.value.toLowerCase();
                showListing(names.filter(function (code) {
                    return code.toLowerCase().indexOf(needle) !== -1
                        || links[code][0].toLowerCase().indexOf(needle) !== -1
                        || links[code][1].toLowerCase().indexOf(needle) !== -1;
                }));
            });
        })();
    </script>
